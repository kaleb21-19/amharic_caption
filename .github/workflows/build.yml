name: build-zips

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-zips
  cancel-in-progress: true

# Pin the model to a known-good HF repo; change this only when you intend to
# rebuild the CT2 int8 weights shipped in the bundle.
env:
  HF_MODEL: badrex/Ethio-ASR-amharic
  # Deliberate, documented licence choice. The bundled ffmpeg is a GPL build
  # (it needs libx264 for the burn-in encoder and libass for the subtitles
  # filter), so prepare_python.sh requires this explicit opt-in before it will
  # stage one. It NEVER permits --enable-nonfree builds, which FFmpeg forbids
  # redistributing outright. Because we ship GPL ffmpeg, tools/build.sh must
  # place licenses/ (GPL text + written source offer) at the zip root.
  AMH_FFMPEG_ALLOW_GPL: "1"

jobs:
  # ---- 1. build the CTranslate2 INT8 model once, upload for reuse ----------
  # The CT2 int8 conversion is platform-independent and identical for all three
  # target zips, so we do it a single time (on a cheap ubuntu runner with CPU
  # torch + ctranslate2) and let the platform jobs download the converted
  # model. Shipping int8 lets the runtime drop torch/transformers (~-1.7GB).
  model-ct2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache HF model download
        uses: actions/cache@v3
        with:
          path: ethio-asr
          key: ethio-asr-${{ env.HF_MODEL }}

      - name: Install conversion deps
        run: >
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu &&
          python -m pip install --quiet "ctranslate2==4.8.1" transformers huggingface_hub scipy

      - name: Download fp32 model
        env:
          PYTHON_BIN: python
        run: bash tools/fetch_model.sh

      - name: Convert to CT2 int8
        env:
          PYTHON_BIN: python
        run: bash tools/make_model_ct2_int8.sh

      - name: Upload CT2 int8 model
        uses: actions/upload-artifact@v4
        with:
          name: model-ct2-int8
          path: tools/stage/model-ct2-int8
          retention-days: 30

  # ---- 1.5. version-drift gate ----------------------------------------------
  # Single source of truth for the shipped version string is APP_VERSION in
  # panel/js/main.js; the manifest, HTML footer and DOM test must all agree.
  # Refuses to cut a release that mixes versions (e.g. 1.4.19 bundle + 1.4.16
  # in the Extension version).
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version strings are consistent
        run: bash tools/check_versions.sh

  # ---- 1.6. automated test gate ---------------------------------------------
  # Runs the fast, dependency-light suites that previously only ran by hand
  # (TESTING.md §8#2/#8#3/§9): panel unit + DOM tests, the engine self-checks,
  # long-audio/diarization/mel-edge-case units, and the Worker's HMAC/license/
  # trial e2e harness. None of these need the full assembled runtime (ffmpeg +
  # relocatable python), so this stays cheap and fast — it is a REQUIRED gate
  # for `release` below, unlike accuracy-gate (see that job for why).
  test:
    needs: model-ct2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps (numpy + soundfile — no torch/ctranslate2 needed)
        # ethio_srt.py imports soundfile at module level (used by read_wav);
        # test_long.py imports ethio_srt, so it needs this even though the
        # stub-engine tests never actually read a real audio file.
        run: python -m pip install --quiet numpy soundfile

      - name: Download CT2 int8 model assets (mel_filters.npy / window.npy only)
        uses: actions/download-artifact@v4
        with:
          name: model-ct2-int8
          path: tools/stage/model-ct2-int8

      - name: Panel unit tests (Node, no deps)
        run: node tools/test/test_panel.js

      - name: Build a placeholder runtime/ for test_panel_dom.js
        # main.js's pickRuntime() and the test's own detectRuntime() both walk
        # a few __dirname-relative candidates before falling back to a
        # personal ~/Documents/amharic-captions dev shortcut — which only
        # ever resolves on the author's own machine. On a fresh CI checkout
        # neither path exists, so several DOM tests that need a "runtime
        # looks complete" reading (status pill, license gate, review open)
        # fail outright. Satisfy the existence checks with placeholders (see
        # runtimeComplete() in main.js) — nothing here is ever executed, the
        # DOM tests fake all subprocess I/O via warmStart/warmSend hooks.
        run: |
          set -euo pipefail
          mkdir -p runtime/bin runtime/python/bin runtime/model
          cp ethio_srt.py ctc_beam.py amh_correct.py amh_vad.py amh_lm.py amh_lm.json.gz runtime/
          ln -s "$(command -v python3)" runtime/python/bin/python3
          touch runtime/bin/ffmpeg && chmod +x runtime/bin/ffmpeg

      - name: Panel DOM tests (Node, no deps)
        run: node tools/test/test_panel_dom.js

      - name: ctc_beam self-check (incl. LM shallow-fusion safe-default + reset)
        run: python ctc_beam.py

      - name: amh_correct self-check
        run: python amh_correct.py

      - name: amh_lm self-check
        run: python amh_lm.py

      - name: Long-audio windowing / resume / punctuation (stub engine)
        run: python tools/test/test_long.py

      - name: Diarization — pure clustering/labelling (no model)
        run: python tools/test/test_diarize.py

      - name: Mel extractor edge cases (ultra-short audio)
        run: python tools/test/test_mel_short.py

      - name: Worker e2e — HMAC, trials, license, webhook auth (38 checks)
        working-directory: tools/telegram-worker
        run: |
          npm install --no-fund --no-audit
          node test/e2e.mjs

  # ---- 1.7. accuracy gate (informational) ------------------------------------
  # Real-golden WER against Common Voice Amharic clips (TESTING.md §1.2g).
  # This is currently RED (mean WER ~52% vs a 15% target) and tracked as an
  # open item, not a regression — hard-blocking `release` on it would stop
  # every release until the model/LM work in tools/retrain/IMPROVEMENTS.md
  # lands. Kept as continue-on-error so the number is visible on every build
  # without silently gating shipping on a known, already-logged issue.
  # Remove continue-on-error once a model upgrade clears the gate.
  accuracy-gate:
    needs: model-ct2
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install inference deps (CT2 runtime only — no torch)
        run: python -m pip install --quiet numpy soundfile "ctranslate2==4.8.1"

      - name: Download CT2 int8 model
        uses: actions/download-artifact@v4
        with:
          name: model-ct2-int8
          path: tools/stage/model-ct2-int8

      - name: Build a minimal fake "runtime" dir for run_engine.sh
        run: |
          set -euo pipefail
          mkdir -p fake_runtime/python/bin
          ln -s "$(command -v python3)" fake_runtime/python/bin/python3
          cp ethio_srt.py amh_correct.py amh_lm.py amh_lm.json.gz amh_mel.py amh_vad.py ctc_beam.py fake_runtime/

      - name: Real-golden WER gate (Common Voice Amharic, §1.2g)
        env:
          AMH_MODEL_DIR: ${{ github.workspace }}/tools/stage/model-ct2-int8
          AMH_VAD: "0"
        run: |
          RUNTIME="${{ github.workspace }}/fake_runtime" \
            bash tools/test/run_engine.sh --fixtures tools/test/fixtures_real --max-wer 0.15

  # ---- 2. build each platform's self-contained zip -------------------------
  # macOS jobs share bash (macOS runner default shell), so no `shell:` key is
  # needed and no `matrix` reference appears in a shell property (GitHub does
  # not allow `matrix` in the `shell:` key). Each platform is its own job; the
  # release job waits for all of them so every release carries all 3 zips.
  build-ar:
    needs: model-ct2
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download CT2 int8 model
        uses: actions/download-artifact@v4
        with:
          name: model-ct2-int8
          path: tools/stage/model-ct2-int8

      - name: Fetch speaker-embedding model
        run: bash tools/embed/fetch_model.sh

      - name: Prepare runtime (python + ffmpeg)
        run: bash tools/prepare_python.sh

      - name: Assemble + zip
        run: bash tools/build.sh mac-arm64

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: amharic-captions-mac-arm64
          path: dist/amharic-captions-mac-arm64.zip
          retention-days: 30
          if-no-files-found: error

# Intel Mac — runs on the arm64 macOS runner (macos-14, much less queued
  # than the old macos-13) and uses AMH_TARGET to stage the x86_64 runtime.
  build-x64:
    needs: model-ct2
    runs-on: macos-14
    env:
      AMH_TARGET: mac-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download CT2 int8 model
        uses: actions/download-artifact@v4
        with:
          name: model-ct2-int8
          path: tools/stage/model-ct2-int8

      - name: Fetch speaker-embedding model
        run: bash tools/embed/fetch_model.sh

      - name: Prepare runtime (python + ffmpeg)
        run: bash tools/prepare_python.sh

      - name: Assemble + zip
        run: bash tools/build.sh mac-x64

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: amharic-captions-mac-x64
          path: dist/amharic-captions-mac-x64.zip
          retention-days: 30
          if-no-files-found: error

  # Windows build — standalone job so it can use the native PowerShell (pwsh)
  # shell without needing `matrix` in the `shell:` key.
  build-win:
    needs: model-ct2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download CT2 int8 model
        uses: actions/download-artifact@v4
        with:
          name: model-ct2-int8
          path: tools/stage/model-ct2-int8

      - name: Fetch speaker-embedding model
        shell: bash
        run: bash tools/embed/fetch_model.sh

      - name: Prepare runtime (python + ffmpeg)
        shell: bash
        run: bash tools/prepare_python.sh

      - name: Assemble + zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build_win.ps1

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: amharic-captions-win-x64
          path: dist/amharic-captions-win-x64.zip
          retention-days: 30
          if-no-files-found: error

  # ---- 3. attach zips to a GitHub Release (one-click downloads) -------------
  # Waits for ALL three platform builds so every release always carries the
  # win-x64, mac-arm64, and mac-x64 zips (the x64 build runs on macos-14 now,
  # so it finishes like the others and can be part of the gate).
  release:
    needs: [build-ar, build-win, build-x64, check-version, test]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build-ar.result == 'success' && needs.build-win.result == 'success' && needs.build-x64.result == 'success' && needs.check-version.result == 'success' && needs.test.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all three zips
        uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          (cd zips && sha256sum *.zip > CHECKSUMS.txt)
          cat zips/CHECKSUMS.txt

      - name: Create/update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_ID}"
          VER="$(grep -o 'ExtensionBundleVersion="[^"]*"' panel/CSXS/manifest.xml | head -1 | sed 's/[^"]*"//;s/"//')"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" zips/*.zip zips/CHECKSUMS.txt \
            --title "Amharic Captions v${VER}" \
            --notes "Amharic Captions v${VER} — self-contained builds for Windows 10/11, macOS (Apple Silicon), and macOS (Intel). Download the zip for your platform and install into Adobe CEP extensions. See the install guide: https://amharic-caption-pro.vercel.app/install/" \
            || { echo "release create failed"; exit 1; }
