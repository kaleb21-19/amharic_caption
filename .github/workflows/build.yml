name: build-zips

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-zips
  cancel-in-progress: true

# Pin the model to a known-good HF repo; change this only when you intend to
# rebuild the CT2 int8 weights shipped in the bundle.
env:
  HF_MODEL: badrex/Ethio-ASR-amharic

jobs:
  # ---- 1. build the CTranslate2 INT8 model once, upload for reuse ----------
  # The CT2 int8 conversion is platform-independent and identical for all three
  # target zips, so we do it a single time (on a cheap ubuntu runner with CPU
  # torch + ctranslate2) and let the platform jobs download the converted
  # model. Shipping int8 lets the runtime drop torch/transformers (~-1.7GB).
  model-ct2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache HF model download
        uses: actions/cache@v3
        with:
          path: ethio-asr
          key: ethio-asr-${{ env.HF_MODEL }}

      - name: Install conversion deps
        run: >
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu &&
          python -m pip install --quiet "ctranslate2==4.8.1" transformers huggingface_hub scipy

      - name: Download fp32 model
        env:
          PYTHON_BIN: python
        run: bash tools/fetch_model.sh

      - name: Convert to CT2 int8
        env:
          PYTHON_BIN: python
        run: bash tools/make_model_ct2_int8.sh

      - name: Upload CT2 int8 model
        uses: actions/upload-artifact@v4
        with:
          name: model-ct2-int8
          path: tools/stage/model-ct2-int8
          retention-days: 30

  # ---- 2. build each platform's self-contained zip -------------------------
  # macOS jobs share bash (macOS runner default shell), so no `shell:` key is
  # needed and no `matrix` reference appears in a shell property (GitHub does
  # not allow `matrix` in the `shell:` key). Each platform is its own job so
  # the slow Intel-mac (macos-13) build does NOT block the Release for the
  # other platforms.
  build-ar:
    needs: model-ct2
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download CT2 int8 model
        uses: actions/download-artifact@v4
        with:
          name: model-ct2-int8
          path: tools/stage/model-ct2-int8

      - name: Prepare runtime (python + ffmpeg)
        run: bash tools/prepare_python.sh

      - name: Assemble + zip
        run: bash tools/build.sh mac-arm64

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: amharic-captions-mac-arm64
          path: dist/amharic-captions-mac-arm64.zip
          retention-days: 30
          if-no-files-found: error

  # Intel Mac — kept as its own non-blocking job; not part of the Release gate.
  build-x64:
    needs: model-ct2
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download CT2 int8 model
        uses: actions/download-artifact@v4
        with:
          name: model-ct2-int8
          path: tools/stage/model-ct2-int8

      - name: Prepare runtime (python + ffmpeg)
        run: bash tools/prepare_python.sh

      - name: Assemble + zip
        run: bash tools/build.sh mac-x64

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: amharic-captions-mac-x64
          path: dist/amharic-captions-mac-x64.zip
          retention-days: 30
          if-no-files-found: error

  # Windows build — standalone job so it can use the native PowerShell (pwsh)
  # shell without needing `matrix` in the `shell:` key.
  build-win:
    needs: model-ct2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download CT2 int8 model
        uses: actions/download-artifact@v4
        with:
          name: model-ct2-int8
          path: tools/stage/model-ct2-int8

      - name: Prepare runtime (python + ffmpeg)
        shell: bash
        run: bash tools/prepare_python.sh

      - name: Assemble + zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build_win.ps1

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: amharic-captions-win-x64
          path: dist/amharic-captions-win-x64.zip
          retention-days: 30
          if-no-files-found: error

  # ---- 3. attach zips to a GitHub Release (one-click downloads) -------------
  # Runs after win-x64 + mac-arm64 finish (the platforms we ship now). The
  # Intel-mac (mac-x64) job is NOT part of this gate — it builds in the
  # background so it never blocks buyers' downloads.
  release:
    needs: [build-ar, build-win]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build-ar.result == 'success' && needs.build-win.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all three zips
        uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true

      - name: Create/update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_ID}"
          RELEASE="Amharic Captions CT2 int8 build (${TAG})"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" zips/*.zip \
            --title "Amharic Captions build" \
            --notes "CT2 int8 build. Download the zip for your platform and extract into Adobe CEP extensions." \
            || { echo "release create failed"; exit 1; }
