name: build-zips

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Pin the model to a known-good HF repo; change this only when you intend to
# rebuild the CT2 int8 weights shipped in the bundle.
env:
  HF_MODEL: snapwre/hohe-asr-amharic
  HF_REVISION: 7ee83bdcf748694409f412e06f6c6747b44b3212
  # Deliberate, documented licence choice. The bundled ffmpeg is a GPL build
  # (it needs libx264 for the burn-in encoder and libass for the subtitles
  # filter), so prepare_python.sh requires this explicit opt-in before it will
  # stage one. It NEVER permits --enable-nonfree builds, which FFmpeg forbids
  # redistributing outright. Because we ship GPL ffmpeg, tools/build.sh must
  # place licenses/ (GPL text + written source offer) at the zip root.
  AMH_FFMPEG_ALLOW_GPL: "1"

jobs:
  # ---- 1. build the CTranslate2 INT8 model once, reuse via run artifact ------
  # The CT2 int8 conversion is platform-independent and identical for all three
  # target zips, so we do it a single time (on a cheap ubuntu runner with CPU
  # torch + ctranslate2) and let the platform jobs fetch the converted model
  # from a short-lived Actions artifact. The artifact is checksum-verified by
  # every consumer and is never made public before all gates pass.
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Cache HF model download
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: ethio-asr
          key: ethio-asr-${{ env.HF_MODEL }}-${{ env.HF_REVISION }}

      - name: Install conversion deps
        run: >
          python -m pip install --quiet "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu &&
          python -m pip install --quiet "ctranslate2==4.8.1" "transformers==4.57.6" "huggingface_hub==0.36.2" "scipy==1.15.3" "sentencepiece==0.2.0"

      - name: Download fp32 model
        env:
          PYTHON_BIN: python
        run: bash tools/fetch_model.sh

      - name: Convert to CT2 int8
        env:
          PYTHON_BIN: python
        run: bash tools/make_model_ct2_int8.sh

      - name: Package CT2 int8 model
        run: tar -czf model-ct2-int8.tar.gz -C tools/stage model-ct2-int8

      - name: Create CT2 model checksum
        run: sha256sum model-ct2-int8.tar.gz > model-ct2-int8.tar.gz.sha256

      - name: Upload CT2 model artifact for gated jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: model-ct2-int8
          path: |
            model-ct2-int8.tar.gz
            model-ct2-int8.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  # ---- 1.5. version-drift gate ----------------------------------------------
  # Single source of truth for the shipped version string is APP_VERSION in
  # panel/js/main.js; the manifest, HTML footer and DOM test must all agree.
  # Refuses to cut a release that mixes versions (e.g. 1.4.19 bundle + 1.4.16
  # in the Extension version).
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify version strings are consistent
        run: bash tools/check_versions.sh

  # ---- 1.6. automated test gate ---------------------------------------------
  # Runs the fast, dependency-light suites that previously only ran by hand
  # (TESTING.md §8#2/#8#3/§9): panel unit + DOM tests, the engine self-checks,
  # long-audio/diarization/mel-edge-case units, and the Worker's HMAC/license/
  # trial e2e harness. None of these need the full assembled runtime (ffmpeg +
  # relocatable python), so this stays cheap and fast. It is a REQUIRED gate
  # for the draft release, together with the real-golden accuracy gate.
  test:
    needs: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install Python deps (numpy + soundfile — no torch/ctranslate2 needed)
        # ethio_srt.py imports soundfile at module level (used by read_wav);
        # test_long.py imports ethio_srt, so it needs this even though the
        # stub-engine tests never actually read a real audio file.
        run: python -m pip install --quiet "numpy==1.26.4" "soundfile==0.13.1"

      - name: Download CT2 int8 model artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: model-ct2-int8
          path: model-artifact

      - name: Verify and unpack CT2 int8 model
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            (cd model-artifact && sha256sum -c model-ct2-int8.tar.gz.sha256)
          else
            (cd model-artifact && shasum -a 256 -c model-ct2-int8.tar.gz.sha256)
          fi
          mkdir -p tools/stage
          tar -xzf model-artifact/model-ct2-int8.tar.gz -C tools/stage

      - name: Panel unit tests (Node, no deps)
        run: node tools/test/test_panel.js

      - name: Build a placeholder runtime/ for test_panel_dom.js
        # main.js's pickRuntime() and the test's own detectRuntime() both walk
        # a few __dirname-relative candidates before falling back to a
        # personal ~/Documents/amharic-captions dev shortcut — which only
        # ever resolves on the author's own machine. On a fresh CI checkout
        # neither path exists, so several DOM tests that need a "runtime
        # looks complete" reading (status pill, license gate, review open)
        # fail outright. Satisfy the existence checks with placeholders (see
        # runtimeComplete() in main.js) — nothing here is ever executed, the
        # DOM tests fake all subprocess I/O via warmStart/warmSend hooks.
        run: |
          set -euo pipefail
          mkdir -p runtime/bin runtime/python/bin runtime/model
          cp ethio_srt.py ctc_beam.py amh_correct.py amh_vad.py amh_lm.py amh_lm.json.gz runtime/
          cp amh_diarize.py runtime/
          touch runtime/silero_vad.onnx runtime/speaker_embed.onnx runtime/model/model_meta.json
          ln -s "$(command -v python3)" runtime/python/bin/python3
          touch runtime/bin/ffmpeg && chmod +x runtime/bin/ffmpeg

      - name: Panel DOM tests (Node, no deps)
        run: node tools/test/test_panel_dom.js

      # Machine identity + license durability. This suite existed but had never
      # been wired into CI, so the regressions it covers (a Premiere upgrade
      # wiping the license, a hostname change reported as "another computer")
      # could ship unnoticed — both were found in the wild on 2026-09-22.
      - name: Panel machine-identity tests (Node, no deps)
        run: node panel/test/machine-id.test.mjs

      - name: Premiere host safety regression (Node, no deps)
        run: node panel/test/host-safety.test.mjs

      - name: ctc_beam self-check (incl. LM shallow-fusion safe-default + reset)
        run: python ctc_beam.py

      - name: amh_correct self-check
        run: python amh_correct.py

      - name: amh_lm self-check
        run: python amh_lm.py

      - name: Long-audio windowing / resume / punctuation (stub engine)
        run: python tools/test/test_long.py

      - name: Diarization — pure clustering/labelling (no model)
        run: python tools/test/test_diarize.py

      - name: Mel extractor edge cases (ultra-short audio)
        run: python tools/test/test_mel_short.py

      - name: Worker e2e — HMAC, trials, license, webhook auth
        working-directory: tools/telegram-worker
        run: |
          npm ci --no-fund --no-audit
          npm audit --audit-level=high
          npx wrangler d1 migrations apply amh_bot --local
          node test/e2e.mjs

  # ---- 1.65. website build + dependency gate --------------------------------
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked website dependencies
        working-directory: website
        run: npm ci --no-fund --no-audit
      - name: Build website
        working-directory: website
        run: npm run build
      - name: Audit production website dependencies
        working-directory: website
        run: npm audit --omit=dev --audit-level=high

  # ---- 1.7. accuracy gate (release-blocking) --------------------------------
  # Real-golden raw WER against the locked Common Voice Amharic set
  # (TESTING.md §1.2g). Production policy approved 2026-09-25: the arithmetic
  # MEAN raw WER across scored runs must be <= 40%. Individual clip scores are
  # still printed for diagnosis and are not silently discarded.
  accuracy-gate:
    needs: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install inference deps (CT2 runtime + onnxruntime for VAD — no torch)
        # onnxruntime is REQUIRED here even though it is only used by the VAD:
        # amh_vad.py returns no segments *silently* when either onnxruntime or
        # silero_vad.onnx is unavailable, so without it this job would quietly
        # score a VAD-off configuration that no customer runs (TESTING.md §1.2j).
        run: python -m pip install --quiet "numpy==1.26.4" "soundfile==0.13.1" "ctranslate2==4.8.1" "onnxruntime==1.20.1"

      - name: Download CT2 int8 model artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: model-ct2-int8
          path: model-artifact

      - name: Verify and unpack CT2 int8 model
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            (cd model-artifact && sha256sum -c model-ct2-int8.tar.gz.sha256)
          else
            (cd model-artifact && shasum -a 256 -c model-ct2-int8.tar.gz.sha256)
          fi
          mkdir -p tools/stage
          tar -xzf model-artifact/model-ct2-int8.tar.gz -C tools/stage

      - name: Build a minimal fake "runtime" dir for run_engine.sh
        run: |
          set -euo pipefail
          mkdir -p fake_runtime/python/bin
          ln -s "$(command -v python3)" fake_runtime/python/bin/python3
          cp ethio_srt.py amh_correct.py amh_lm.py amh_lm.json.gz amh_mel.py amh_vad.py ctc_beam.py fake_runtime/
          # amh_vad.py loads silero_vad.onnx from ITS OWN directory. Omitting it
          # disables speech-gap detection with no error at all, which is exactly
          # how this gate came to measure something the product does not do.
          cp tools/vad/silero_vad.onnx fake_runtime/
          test -f fake_runtime/silero_vad.onnx

      # Assert the VAD is actually live before scoring anything. A silent
      # fallback to "no segments" is the failure mode this job had for its whole
      # existence, and it moves WER by ~6pp on these clips — enough to make the
      # number meaningless without ever going red.
      - name: Verify the VAD really loaded (no silent fallback)
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0, "fake_runtime")
          import amh_vad
          if amh_vad._load_session() is None:
              raise SystemExit("VAD did not load — this gate would score a configuration nobody ships")
          print("VAD session loaded OK")
          PY

      - name: Real-golden WER gate (Common Voice Amharic, §1.2g)
        # NB: AMH_VAD is deliberately NOT set to 0 any more. This job exists to
        # measure what customers run, and they run with VAD on.
        env:
          AMH_MODEL_DIR: ${{ github.workspace }}/tools/stage/model-ct2-int8
        run: |
          RUNTIME="${{ github.workspace }}/fake_runtime" \
            bash tools/test/run_engine.sh --fixtures tools/test/fixtures_real --mean-max-wer 0.40

  # ---- 2. build each platform's self-contained zip -------------------------
  # macOS jobs share bash (macOS runner default shell), so no `shell:` key is
  # needed and no `matrix` reference appears in a shell property (GitHub does
  # not allow `matrix` in the `shell:` key). Each platform is its own job; the
  # release job waits for all of them so every release carries all 3 zips.
  build-ar:
    needs: model
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Download CT2 int8 model artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: model-ct2-int8
          path: model-artifact

      - name: Verify and unpack CT2 int8 model
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            (cd model-artifact && sha256sum -c model-ct2-int8.tar.gz.sha256)
          else
            (cd model-artifact && shasum -a 256 -c model-ct2-int8.tar.gz.sha256)
          fi
          mkdir -p tools/stage
          tar -xzf model-artifact/model-ct2-int8.tar.gz -C tools/stage

      - name: Fetch speaker-embedding model
        run: bash tools/embed/fetch_model.sh

      - name: Prepare runtime (python + ffmpeg)
        run: bash tools/prepare_python.sh

      - name: Assemble + zip
        run: bash tools/build.sh mac-arm64

      - name: Create mac-arm64 package checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/amharic-captions-mac-arm64.zip > dist/amharic-captions-mac-arm64.zip.sha256
          else
            shasum -a 256 dist/amharic-captions-mac-arm64.zip > dist/amharic-captions-mac-arm64.zip.sha256
          fi

      - name: Upload mac-arm64 package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-mac-arm64
          path: |
            dist/amharic-captions-mac-arm64.zip
            dist/amharic-captions-mac-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 1

# Intel Mac — cross-stages the x86_64 runtime from the arm64 macOS runner.
  build-x64:
    needs: model
    runs-on: macos-15
    env:
      AMH_TARGET: mac-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Download CT2 int8 model artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: model-ct2-int8
          path: model-artifact

      - name: Verify and unpack CT2 int8 model
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            (cd model-artifact && sha256sum -c model-ct2-int8.tar.gz.sha256)
          else
            (cd model-artifact && shasum -a 256 -c model-ct2-int8.tar.gz.sha256)
          fi
          mkdir -p tools/stage
          tar -xzf model-artifact/model-ct2-int8.tar.gz -C tools/stage

      - name: Fetch speaker-embedding model
        run: bash tools/embed/fetch_model.sh

      - name: Prepare runtime (python + ffmpeg)
        run: bash tools/prepare_python.sh

      - name: Assemble + zip
        run: bash tools/build.sh mac-x64

      - name: Create mac-x64 package checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/amharic-captions-mac-x64.zip > dist/amharic-captions-mac-x64.zip.sha256
          else
            shasum -a 256 dist/amharic-captions-mac-x64.zip > dist/amharic-captions-mac-x64.zip.sha256
          fi

      - name: Upload mac-x64 package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-mac-x64
          path: |
            dist/amharic-captions-mac-x64.zip
            dist/amharic-captions-mac-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  # Windows build — standalone job so it can use the native PowerShell (pwsh)
  # shell without needing `matrix` in the `shell:` key.
  build-win:
    needs: model
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Download CT2 int8 model artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: model-ct2-int8
          path: model-artifact

      - name: Verify and unpack CT2 int8 model
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            (cd model-artifact && sha256sum -c model-ct2-int8.tar.gz.sha256)
          else
            (cd model-artifact && shasum -a 256 -c model-ct2-int8.tar.gz.sha256)
          fi
          mkdir -p tools/stage
          tar -xzf model-artifact/model-ct2-int8.tar.gz -C tools/stage

      - name: Fetch speaker-embedding model
        shell: bash
        run: bash tools/embed/fetch_model.sh

      - name: Prepare runtime (python + ffmpeg)
        shell: bash
        run: bash tools/prepare_python.sh

      - name: Assemble + zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build_win.ps1

      - name: Upload win-x64 package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-win-x64
          path: dist/amharic-captions-win-x64.zip
          if-no-files-found: error
          retention-days: 1

  # ---- 3. publish gate -------------------------------------------------------
  # Build jobs only upload short-lived Actions artifacts. Only this protected
  # main-branch job has release write permission, and it runs after every gate.
  publish-ready:
    needs: [build-ar, build-win, build-x64, check-version, test, website, accuracy-gate]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.ref_protected == true && needs.build-ar.result == 'success' && needs.build-win.result == 'success' && needs.build-x64.result == 'success' && needs.check-version.result == 'success' && needs.test.result == 'success' && needs.website.result == 'success' && needs.accuracy-gate.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Download gated package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Generate and verify package checksums
        run: |
          set -euo pipefail
          for z in amharic-captions-win-x64.zip \
                   amharic-captions-mac-arm64.zip \
                   amharic-captions-mac-x64.zip; do
            test -f "release-assets/$z"
            (cd release-assets && sha256sum "$z" > "$z.sha256" && sha256sum -c "$z.sha256")
          done

      - name: Stage verified packages in a commit-bound draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$(grep -o 'ExtensionBundleVersion="[^"]*"' panel/CSXS/manifest.xml | head -1 | sed 's/[^"]*"//;s/"//')"
          TAG="v${VER}"
          export GITHUB_REPOSITORY="${{ github.repository }}"
          export GITHUB_SHA="${GITHUB_SHA}"
          export RELEASE_TAG="$TAG"
          for z in amharic-captions-win-x64.zip \
                   amharic-captions-mac-arm64.zip \
                   amharic-captions-mac-x64.zip; do
            bash tools/publish_public_zip.sh "release-assets/$z"
          done

      - name: Verify draft provenance and exact asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$(grep -o 'ExtensionBundleVersion="[^"]*"' panel/CSXS/manifest.xml | head -1 | sed 's/[^"]*"//;s/"//')"
          TAG="v${VER}"
          DRAFT="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')"
          test "$DRAFT" = "true" || { echo "$TAG is not a draft; refusing to publish" >&2; exit 1; }
          TAG_SHA="$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq .sha)"
          test "$TAG_SHA" = "$GITHUB_SHA" || { echo "release tag $TAG points at $TAG_SHA, expected $GITHUB_SHA" >&2; exit 1; }
          ASSETS="$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | sort)"
          EXPECTED="$(printf '%s\n' \
            amharic-captions-win-x64.zip \
            amharic-captions-win-x64.zip.sha256 \
            amharic-captions-mac-arm64.zip \
            amharic-captions-mac-arm64.zip.sha256 \
            amharic-captions-mac-x64.zip \
            amharic-captions-mac-x64.zip.sha256 | sort)"
          diff -u <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$ASSETS")
          SUMDIR="$(mktemp -d)"
          trap 'rm -rf "$SUMDIR"' EXIT
          for z in amharic-captions-win-x64.zip \
                   amharic-captions-mac-arm64.zip \
                   amharic-captions-mac-x64.zip; do
            gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$z.sha256" --dir "$SUMDIR" >/dev/null
            RECORDED="$(awk 'length($1) == 64 && $1 ~ /^[0-9a-f]+$/ { print $1; exit }' "$SUMDIR/$z.sha256")"
            test -n "$RECORDED"
            gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$z" --dir "$SUMDIR" >/dev/null
            ACTUAL="$(sha256sum "$SUMDIR/$z" | awk '{print $1; exit}')"
            test "$RECORDED" = "$ACTUAL"
          done

      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$(grep -o 'ExtensionBundleVersion="[^"]*"' panel/CSXS/manifest.xml | head -1 | sed 's/[^"]*"//;s/"//')"
          TAG="v${VER}"
          LATEST="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$LATEST" ] && [ "$LATEST" != "$TAG" ]; then
            HIGHEST="$(printf '%s\n%s\n' "${LATEST#v}" "$VER" | sort -V | tail -1)"
            test "$HIGHEST" = "$VER" || { echo "refusing to make $TAG latest over $LATEST" >&2; exit 1; }
          fi
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest

      - name: Verify public download URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=0
          for z in amharic-captions-win-x64.zip \
                   amharic-captions-mac-arm64.zip \
                   amharic-captions-mac-x64.zip; do
            url="https://github.com/${{ github.repository }}/releases/latest/download/$z"
            code="$(curl -s -o /dev/null -I -L -w '%{http_code}' "$url" || true)"
            echo "  $code  $url"
            [ "$code" = "200" ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "Release is public but URL verification failed; manual remediation is required" >&2
            exit 1
          fi

          echo "Customers install from https://amharic-caption-pro.vercel.app/install"
