name = "amharic-captions-bot"
main = "src/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ---- Free-tier bindings -------------------------------------------------
# D1: SQLite database for orders + sold keys (stateful replacement for
# pending.json + customers.csv).
[[d1_databases]]
binding = "DB"
database_name = "amh_bot"
database_id = "ba278e9c-b56e-400d-bc1d-53f7c3f8431c"

# KV: cache for /api/trial, /api/validate, pending-count + rate-limit
# markers. Keeps hot reads off D1 quotas and throttles abuse.
[[kv_namespaces]]
binding = "AMH_KV"
id = "49415337946e41168f0f2c8958ea3ede"

# NOTE: R2 is intentionally NOT used. Payment-proof screenshots are stored as
# BLOBs directly in D1 (fine at this bot's tiny volume, and avoids needing a
# card on file to enable R2).

# ---- Secrets (set via `wrangler secret put`, never in this file) --------
# AMH_TG_TOKEN      : the Telegram bot token
# AMH_ADMIN_ID      : numeric admin chat id (comma-separated => multi-admin)
# AMH_SECRET        : the HMAC license-key secret
# AMH_WEBHOOK_SECRET: random string, ALSO registered as Telegram's webhook
#                     secret_token so forged updates are rejected (401).
# AMH_API_KEY       : optional deployment-level gate for /api/*; public desktop
#                     clients cannot keep a meaningful shared secret. Set
#                     AMH_REQUIRE_API_KEY=1 only when an external network policy
#                     also protects the Worker.
# AMH_LICENSE_SIGNING_KEY: required PKCS8 ECDSA P-256 private key used to sign
#                     install leases. Successful validation fails closed without it.
# AMH_ALLOWED_ORIGIN: CORS allow-list, comma-separated (include 'null' and
#                     'file://' for CEP panels). Empty => no browser origin is allowed.

[vars]
AMH_GROUP_ID = "-1004403686687"
# Support-group topic ids: topic names in the bot's group messages become links.
AMH_GROUP_TOPICS = "discussion:164,windows:75,mac:80,payment:41,jobs:131"
# Editing-jobs feed: the support group, and the public job channels it reads
# (turn it on/off in the bot: /start -> 💼 Jobs feed).
# Usernames verified against t.me/s/<name> on 2026-10-02 (each returns public
# posts). Dropped as dead (zero posts in 24h): josad_jobs, geez_jobs, geezjob,
# elelanajob. Still missing handles for "Ethio daily vacancy" and the Amharic
# "Beleqet Jobs" — add them here once the usernames are known.
AMH_SUPPORT_GROUP = "-1003962455059"
# The group is public now: t.me/EthioEditingJobs opens for anyone (better than the invite link).
AMH_SUPPORT_INVITE = "https://t.me/EthioEditingJobs"
# Public jobs channel that mirrors every job card (create it, add the bot as admin
# with "Post messages", then remove the # below and deploy):
# AMH_JOBS_CHANNEL = "@EthiopianEditingJobs"
AMH_JOB_CHANNELS = "beleqetjobs,freelance_ethio,AfriworkAmharic,ethiojobsofficial,ethiojobs_official,Ethiojobs2000,ethio_job_vacancy1,ethio_job_vacancy,ethio_jobs_vacancy,josad_digital,effoyjobs,harmeejobs,fanajobs,hahujobs,jobs_in_ethio,ngojobs,elelanajobs,ethiojobshubs"
AMH_PRICE = "ETB 2,500"
AMH_PRICE_ETB = "2500"
AMH_ACCT_NAME = "KALEB TEGEGEN"
AMH_PAY_ACCOUNTS = "CBE 1000504159977 · Abyssinia 402393939 · Zemen 1031111343277015"
AMH_REQUIRE_API_KEY = "0"
# New-machine trials allowed per source IP per day. Ethiopian mobile carriers
# put many customers behind one shared (CGNAT) IP, so the code default of 5
# would silently deny free trials to real buyers.
AMH_FRESH_MID_DAY = "30"
# Narrow browser origins for the CEP panel; the CEF has no disable-web-security
# flag, so an unset allow-list would block activation/trial fetches.
AMH_ALLOWED_ORIGIN = "null,file://"
# Invite link for the support group, used by the home-screen Support button and
# by the post-purchase "join the group" prompt. Set it here to rotate the link
# without a code change; if unset the built-in default is used. Not a secret —
# it is meant to be shared.
AMH_SUPPORT_INVITE = "https://t.me/+L-bMfmIRyEo3MDg0"

# Every 6h: prune orders/funnel older than 30 days (keeps the history window
# consistent without depending on admin activity).
# Every minute: send the next batch of a running broadcast (one cheap query
# when none is running) — see processBroadcast() in src/worker.js.
[triggers]
crons = ["0 */6 * * *", "* * * * *"]
